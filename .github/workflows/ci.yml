name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Set up supported npm version
        run: npm install --global npm@11.16.0

      - name: Set up supported Docker Compose
        env:
          CM_COMPOSE_URL: https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
          CM_COMPOSE_SHA256: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372
        run: |
          compose_root="$RUNNER_TEMP/chimpmaera-docker-config"
          plugin_dir="$compose_root/cli-plugins"
          compose_binary="$plugin_dir/docker-compose"
          mkdir -p "$plugin_dir"
          curl --fail --location --silent --show-error \
            --output "$compose_binary" "$CM_COMPOSE_URL"
          printf '%s  %s\n' "$CM_COMPOSE_SHA256" "$compose_binary" \
            | sha256sum --check -
          chmod 0755 "$compose_binary"
          printf 'DOCKER_CONFIG=%s\n' "$compose_root" >> "$GITHUB_ENV"
          test "v$(DOCKER_CONFIG="$compose_root" docker compose version --short)" = v2.40.3

      - name: Verify release-tree checksums
        run: sha256sum --check SHA256SUMS

      - name: Verify fail-closed release governance
        run: |
          npm run release-governance:verify
          npm run release-governance:test

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The locked native package ships symlink metadata, not usable library
      # links. Keep other dependency scripts disabled; hydrate only this package.
      - name: Prepare embedded PostgreSQL runtime
        run: |
          npm rebuild @embedded-postgres/linux-x64
          node_modules/@embedded-postgres/linux-x64/native/bin/initdb --version
          node_modules/@embedded-postgres/linux-x64/native/bin/postgres --version

      - name: Lint
        run: npm run lint

      - name: Verify supply-chain declarations
        run: npm run supply-chain:verify

      - name: Prepare the exact public PAN454 synthetic runtime image
        # Image acquisition is outside the NETWORK_NONE execution window.
        # Never substitute a floating tag or broaden workload permissions.
        run: docker pull --platform linux/amd64 node@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03

      # Includes the authoritative npm test lifecycle (pretest + test + posttest)
      # in the proof's sanitized child environment; do not run it a second time.
      - name: Run SAFE_GUIDED secure-default proof and full project suite
        run: npm run proof:secure-default

      - name: Verify external video service boundary
        run: npm run external-video-service:test

      - name: Derive scoped module graph, impact and release manifest
        env:
          MODULE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          output="module-contribution-output"
          mkdir -p "$output"
          node scripts/module-contribution.mjs check
          node scripts/module-contribution.mjs graph > "$output/graph.json"
          if test -n "$MODULE_BASE" && test "$MODULE_BASE" != 0000000000000000000000000000000000000000; then
            node scripts/module-contribution.mjs impact --base "$MODULE_BASE" > "$output/impact.json"
          else
            printf '%s\n' '{"status":"NO_BASE","note":"No change-impact claim for this run"}' > "$output/impact.json"
          fi
          node scripts/module-contribution.mjs release > "$output/manifest.json"
          node scripts/module-contribution.mjs verify --manifest "$output/manifest.json"
          printf '%s\n' '### Module contribution automation' \
            'Scoped graph, impact suggestions and byte-bound manifest are attached to this run.' \
            'Coverage is declared, not repository-wide. Integrity is not semantic compatibility or release approval.' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain generated module contribution views
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: module-contribution-${{ github.sha }}
          path: module-contribution-output
          if-no-files-found: error
          retention-days: 30

      - name: Confirm tests did not modify tracked files
        run: git diff --exit-code

  workflow-lint:
    name: Validate all workflows with pinned actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install digest-verified pinned actionlint
        env:
          CM_ACTIONLINT_ARCHIVE: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          CM_ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          download_dir="${RUNNER_TEMP}/actionlint-v1.7.12"
          install -d -m 700 "$download_dir"
          curl --fail --location --silent --show-error \
            --output "$download_dir/actionlint.tar.gz" "$CM_ACTIONLINT_ARCHIVE"
          printf '%s  %s\n' "$CM_ACTIONLINT_SHA256" "$download_dir/actionlint.tar.gz" \
            | sha256sum --check -
          tar -xzf "$download_dir/actionlint.tar.gz" -C "$download_dir"
          test -x "$download_dir/actionlint"
          version_output="$("$download_dir/actionlint" --version)"
          test "${version_output%%$'\n'*}" = "1.7.12"

      - name: Validate every workflow with the pinned validator
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint-v1.7.12/actionlint" \
            -shellcheck= -pyflakes= .github/workflows/*.yml
