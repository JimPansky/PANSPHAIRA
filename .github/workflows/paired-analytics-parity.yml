# PAR-XR-01 — Paired-Analytics compatibility gate (producer x consumer).
#
# Secure, fail-closed CI: rebuilds, runs the adversarial TDD suite, re-derives
# the head-bound evidence from the exact manifests and confirms it is
# reproducible. Anonymous public fetch only; no secrets or production/customer/publication
# or closure effect. The accepted pair claim is bounded to the exact tested
# heads.
name: Paired-Analytics Parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paired-analytics-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-analytics-parity:
    name: Gate the exact paired-analytics compatibility pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build --silent

      - name: Run the adversarial paired-analytics parity suite
        run: npm run paired-analytics:test:compiled

      - name: Re-derive the head-bound evidence and confirm reproducibility
        run: |
          node scripts/run-paired-analytics-parity.mjs
          node scripts/run-paired-analytics-parity.mjs --check

      - name: Fetch the immutable public counterpart without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git init "$RUNNER_TEMP/paired-ks"
          git -C "$RUNNER_TEMP/paired-ks" -c credential.helper= fetch --depth=1 https://github.com/JoFe2/KaleidoSphere.git 545a3b44ea88c96eded060c11c7c3a2afe0edff6
          git -C "$RUNNER_TEMP/paired-ks" checkout --detach FETCH_HEAD

      - name: Execute the pinned counterpart and bind actual Git heads
        env:
          EXPECTED_PAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/run-paired-analytics-parity.mjs --counterpart "$RUNNER_TEMP/paired-ks" --pan-head "$EXPECTED_PAN_HEAD" --output "$RUNNER_TEMP/paired-analytics-execution.json"
          (cd "$RUNNER_TEMP" && sha256sum paired-analytics-execution.json > paired-analytics-execution.sha256)
          cat "$RUNNER_TEMP/paired-analytics-execution.json"

      - name: Preserve exact-head execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paired-analytics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/paired-analytics-execution.json
            ${{ runner.temp }}/paired-analytics-execution.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Confirm the suite and runner performed no tracked-file mutation
        run: git diff --exit-code

  forward-paired-execution:
    name: Execute the qualified service pair (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: main
            head: 792e5e38cd4fb612ee034b3edc62aa8b4f58fe0f
          - profile: pr235
            head: bb52b249feb5968eee286963989f98f3bb673996
          # Retained historical current pair (the retained PAN346 source candidate, 994ac801).
          - profile: current-ks
            head: 994ac80113af284ffe9fde93bb11f2341aaace91
          # Frozen current release pair (PAN 4330cd26 x KS 72d9a4af, release 2026_09_28_v1).
          - profile: current-frozen
            head: 72d9a4af87fbbc5b23cb52835cd2f85415b8ddc7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the qualified runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          architecture: x64
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch the exact public service source without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git init "$RUNNER_TEMP/forward-ks"
          git -C "$RUNNER_TEMP/forward-ks" -c credential.helper= fetch --depth=1 https://github.com/JoFe2/KaleidoSphere.git ${{ matrix.head }}
          git -C "$RUNNER_TEMP/forward-ks" checkout --detach FETCH_HEAD
      - name: Rebuild and execute the actual loopback service and pair
        env:
          EXPECTED_PAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/run-forward-paired-analytics.mjs --profile ${{ matrix.profile }} --counterpart "$RUNNER_TEMP/forward-ks" --pan-head "$EXPECTED_PAN_HEAD" --output "$RUNNER_TEMP/forward-paired-execution.json"
          (cd "$RUNNER_TEMP" && sha256sum forward-paired-execution.json > forward-paired-execution.sha256)
      - name: Preserve exact-head forward execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forward-paired-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/forward-paired-execution.json
            ${{ runner.temp }}/forward-paired-execution.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Confirm tracked source remains unchanged
        run: git diff --exit-code
