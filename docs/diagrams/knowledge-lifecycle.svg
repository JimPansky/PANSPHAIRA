<svg aria-labelledby="chart-title-diagram-knowledge-lifecycle" aria-describedby="chart-desc-diagram-knowledge-lifecycle" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 392.75 518.4000244140625" style="max-width: 392.75px;" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="100%" id="diagram-knowledge-lifecycle"><title id="chart-title-diagram-knowledge-lifecycle">Simplified qualification before reuse</title><desc id="chart-desc-diagram-knowledge-lifecycle">Observations and sources inform a candidate, which is tested and reviewed before versioning and reevaluation in another context. This is not the exact promotion state machine and grants no execution authority.</desc><style>#diagram-knowledge-lifecycle{font-family:Arial,sans-serif;font-size:16px;fill:#152536;}#diagram-knowledge-lifecycle .error-icon{fill:hsl(38.8235294118, 100%, 100%);}#diagram-knowledge-lifecycle .error-text{fill:#000000;stroke:#000000;}#diagram-knowledge-lifecycle .edge-thickness-normal{stroke-width:1px;}#diagram-knowledge-lifecycle .edge-thickness-thick{stroke-width:3.5px;}#diagram-knowledge-lifecycle .edge-pattern-solid{stroke-dasharray:0;}#diagram-knowledge-lifecycle .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-knowledge-lifecycle .edge-pattern-dashed{stroke-dasharray:3;}#diagram-knowledge-lifecycle .edge-pattern-dotted{stroke-dasharray:2;}#diagram-knowledge-lifecycle .marker{fill:#586d8a;stroke:#586d8a;}#diagram-knowledge-lifecycle .marker.cross{stroke:#586d8a;}#diagram-knowledge-lifecycle svg{font-family:Arial,sans-serif;font-size:16px;}#diagram-knowledge-lifecycle p{margin:0;}#diagram-knowledge-lifecycle .label{font-family:Arial,sans-serif;color:#152536;}#diagram-knowledge-lifecycle .cluster-label text{fill:#000000;}#diagram-knowledge-lifecycle .cluster-label span{color:#000000;}#diagram-knowledge-lifecycle .cluster-label span p{background-color:transparent;}#diagram-knowledge-lifecycle .label text,#diagram-knowledge-lifecycle span